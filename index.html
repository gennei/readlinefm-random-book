<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="readline.fmで紹介した本から、エピソードを聴ける一冊をランダムに選びます。">
    <meta name="theme-color" content="#f2ecdf">
    <title>readline.fm Random Book</title>
    <link rel="stylesheet" href="assets/styles.css">
  </head>
  <body>
    <div class="site-shell">
      <header class="masthead">
        <div class="brand" aria-label="readline.fm Random Book">
          <span class="brand-mark">readline.fm</span>
          <span class="brand-note">Random Book / Listening Edition</span>
        </div>
        <a
          class="nav-link"
          href="https://open.spotify.com/show/22XECbp5qYysimTjNw7Tw7"
          target="_blank"
          rel="noopener noreferrer"
        >Spotify ↗</a>
      </header>

      <main class="book-layout" aria-live="polite">
        <section class="cover-column" aria-label="選ばれた本の書影">
          <div class="book-object">
            <div class="cover-fallback" id="cover-fallback" aria-hidden="true">
              <span class="cover-kicker">readline.fm selected books</span>
              <span class="cover-title" id="cover-title">Loading…</span>
              <span class="cover-episode" id="cover-episode">EP—</span>
            </div>
            <img class="cover-image" id="cover-image" alt="">
          </div>
        </section>

        <section class="content-column">
          <p class="issue" id="issue">EP— · PART 1</p>
          <div class="title-slot" id="title-slot" data-episode="EP—">
            <h1 class="book-title" id="book-title">本を選んでいます</h1>
          </div>
          <p class="book-meta" id="book-meta">readline.fmで紹介した一冊</p>
          <ol class="description" id="description"></ol>
          <div class="actions">
            <a
              class="episode-link"
              id="episode-link"
              href="https://listen.style/p/readlinefm"
              target="_blank"
              rel="noopener noreferrer"
            >この本のエピソードを聴く ↗</a>
          </div>
        </section>
      </main>

      <footer class="site-footer">
        <p class="catalog-note" id="catalog-note">— playable</p>
        <p class="status" id="status" role="status">loading the shelf</p>
      </footer>
    </div>

    <button class="floating-shuffle" id="shuffle" type="button" aria-label="もう1回、別の本をランダムに選ぶ">
      <span class="floating-shuffle-label">もう1回</span>
    </button>

    <script id="book-data" type="application/json" data-src="data/books.json"></script>
    <script src="assets/app.js" defer></script>
  </body>
</html>
